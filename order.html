<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquabuddy Pure Water — Order</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h2 class="logo">Aquabuddy</h2>
      <nav>
        <a href="index.html">Home</a>
        <a href="order.html">Order</a>
        <a href="raffle.html">Raffle</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <section id="order" class="section">
      <h2>Request a Delivery</h2>
      <p>Fill in the form and tell us where to bring your water.</p>

      <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" />

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="09XX XXX XXXX" />

        <label for="address">Address or landmark</label>
        <input
          type="text"
          id="address"
          placeholder="House, street, or nearby landmark"
        />

        <label for="gallons">Number of gallons</label>
        <input type="number" id="gallons" value="5" min="1" />

        <label for="time">Preferred time</label>
        <select id="time">
          <option>Morning</option>
          <option>Afternoon</option>
          <option>Any time</option>
        </select>

        <button type="submit" class="button red">Send Request</button>
      </form>

      <p class="small">
        Note: This form is for design only. It does not send orders yet.
      </p>
    </section>

    <footer>
      <p>"You can live without love but not without water."</p>
      <p>Aquabuddy Pure Water</p>
    </footer>
  </body>
</html>
